version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Wait a week after a release before proposing it. A hijacked release is
    # usually caught and pulled within days, and patch bumps merge on their own.
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 fails the type check and is not yet known to work with
      # WXT and Vitest. Remove this rule when upgrading to it by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # markdown-it and its plugins require each other's versions through peer
      # dependencies, so they update together in one PR, major versions included.
      markdown-it:
        patterns:
          - "*markdown-it*"
          - "@mdit/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          # A package that matches two groups goes to the more specific one,
          # which would be this group, so the markdown-it packages are excluded.
          - "*markdown-it*"
          - "@mdit/*"
          # Below 1.0 a minor version can break the API, but Dependabot still
          # counts it as minor. These packages get a PR each.
          - wxt
          - katex
          - sharp

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week after a release before proposing it. A hijacked release is
    # usually caught and pulled within days, and patch bumps merge on their own.
    cooldown:
      default-days: 7
