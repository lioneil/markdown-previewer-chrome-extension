version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # markdown-it and its plugins require each other's versions through peer
      # dependencies, so they update together in one PR, major versions included.
      markdown-it:
        patterns:
          - "*markdown-it*"
          - "@mdit/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          # A package that matches two groups goes to the more specific one,
          # which would be this group, so the markdown-it packages are excluded.
          - "*markdown-it*"
          - "@mdit/*"
          # Below 1.0 a minor version can break the API, but Dependabot still
          # counts it as minor. These packages get a PR each.
          - wxt
          - katex
          - sharp

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
