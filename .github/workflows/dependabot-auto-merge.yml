name: Dependabot auto-merge

# Turns on auto-merge for Dependabot PRs that update a GitHub Action or bump
# npm packages by a patch version. The PR still waits for the required CI check.
# Minor and major npm updates are left for a manual review, since the tests
# render neither Mermaid diagrams nor KaTeX math.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge
        if: steps.metadata.outputs.package-ecosystem == 'github_actions' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
