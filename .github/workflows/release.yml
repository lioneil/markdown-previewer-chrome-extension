name: Release

# Runs when a version tag is pushed. To release:
#   npm version patch        (or minor / major: bumps package.json, commits and tags)
#   git push --follow-tags

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm version` writes both, so a mismatch means the tag was made by hand.
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build and zip
        id: zip
        run: |
          npx wxt zip
          echo "path=$(ls .output/*-chrome.zip)" >> "$GITHUB_OUTPUT"

      # The zip attached here is the one to upload to the Chrome Web Store dashboard.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.zip.outputs.path }}"
