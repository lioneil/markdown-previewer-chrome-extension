<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <svg class="popup-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 62"><path fill-rule="evenodd" fill="#000" d="m31 62c-17.14 0-31-13.86-31-31 0-17.14 13.86-31 31-31 17.14 0 31 13.86 31 31 0 17.14-13.86 31-31 31z"/><path fill-rule="evenodd" fill="#000" d="m31 31v31h-31v-31z"/><path fill-rule="evenodd" fill="#fff" d="m52 19.21v26.58h-42v-26.58z"/><path fill-rule="evenodd" fill="#000" d="m53.5 17.08v27.34c0 5.01-4.07 9.08-9.08 9.08h-36.42v-36.42c0-5.01 4.07-9.08 9.08-9.08h27.34c5.01 0 9.08 4.07 9.08 9.08zm-41.94 22.41h5.14v-10.03l5.14 6.43 5.14-6.43v10.03h5.15v-17.48h-5.15l-5.14 6.43-5.14-6.43h-5.14zm32.14 0l7.71-8.49h-5.14v-8.99h-5.14v8.99h-5.15z"/></svg>
      <div class="popup-title">Markdown Previewer</div>
      <div class="popup-version" id="version"></div>
    </header>

    <section class="popup-section">
      <h2 class="popup-section-title">Options</h2>
      <div class="popup-toggles">
        <label class="toggle-row" id="enable-row">
          <span class="toggle-label">Enable preview</span>
          <span class="toggle-switch">
            <input type="checkbox" class="toggle-input" id="enable-toggle" checked>
            <span class="toggle-slider"></span>
          </span>
        </label>
        <label class="toggle-row" id="toggle-all-row">
          <span class="toggle-label">Toggle all plugins</span>
          <span class="toggle-switch">
            <input type="checkbox" class="toggle-input" id="toggle-all" checked>
            <span class="toggle-slider"></span>
          </span>
        </label>
      </div>
      <div class="popup-divider"></div>
      <div id="plugin-list" class="popup-toggles"></div>
    </section>

    <footer class="popup-footer">
      <button id="reset-btn" class="popup-reset">Reset to defaults</button>
    </footer>
  </div>

  <script src="./main.ts" type="module"></script>
</body>
</html>
