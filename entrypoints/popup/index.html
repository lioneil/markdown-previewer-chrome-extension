<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <svg class="popup-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 62"><path fill="currentColor" d="M62,12.377l-0,37.246c-0,6.831 -5.546,12.377 -12.377,12.377l-49.623,-0l0,-49.623c0,-6.831 5.546,-12.377 12.377,-12.377l37.246,-0c6.831,-0 12.377,5.546 12.377,12.377Zm-57.151,30.534l7.007,0l-0,-13.663l7.006,8.759l7.007,-8.759l0,13.663l7.007,0l-0,-23.822l-7.007,-0l-7.007,8.758l-7.006,-8.758l-7.007,-0l0,23.822Zm43.792,0l10.51,-11.561l-7.007,0l0,-12.261l-7.006,-0l-0,12.261l-7.007,0l10.51,11.561Z"/></svg>
      <div class="popup-title">Markdown Previewer</div>
      <div class="popup-version" id="version"></div>
    </header>

    <section class="popup-section">
      <h2 class="popup-section-title">Options</h2>
      <div class="popup-toggles">
        <label class="toggle-row" id="enable-row">
          <span class="toggle-label">Enable preview</span>
          <span class="toggle-switch">
            <input type="checkbox" class="toggle-input" id="enable-toggle" checked>
            <span class="toggle-slider"></span>
          </span>
        </label>
        <label class="toggle-row" id="toggle-all-row">
          <span class="toggle-label">Toggle all plugins</span>
          <span class="toggle-switch">
            <input type="checkbox" class="toggle-input" id="toggle-all" checked>
            <span class="toggle-slider"></span>
          </span>
        </label>
      </div>
      <div class="popup-divider"></div>
      <div id="plugin-list" class="popup-toggles"></div>
    </section>

    <footer class="popup-footer">
      <button id="reset-btn" class="popup-reset">Reset to defaults</button>
    </footer>
  </div>

  <script src="./main.ts" type="module"></script>
</body>
</html>
