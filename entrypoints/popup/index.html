<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <svg class="popup-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path fill="currentColor" d="M593.8 59.1H46.2C20.7 59.1 0 79.8 0 105.2v301.5c0 25.5 20.7 46.2 46.2 46.2h547.7c25.5 0 46.2-20.7 46.1-46.1V105.2c0-25.4-20.7-46.1-46.2-46.1zM338.5 360.6H277v-120l-61.5 76.9-61.5-76.9v120H92.3V151.4h61.5l61.5 76.9 61.5-76.9h61.5v209.2zm135.3 3.1L381.5 256H443V151.4h61.5V256H566z"/></svg>
      <div class="popup-title">Markdown Previewer</div>
      <div class="popup-version" id="version"></div>
    </header>

    <section class="popup-section">
      <h2 class="popup-section-title">Options</h2>
      <div class="popup-toggles">
        <label class="toggle-row" id="enable-row">
          <span class="toggle-label">Enable preview</span>
          <span class="toggle-switch">
            <input type="checkbox" class="toggle-input" id="enable-toggle" checked>
            <span class="toggle-slider"></span>
          </span>
        </label>
        <label class="toggle-row" id="toggle-all-row">
          <span class="toggle-label">Toggle all plugins</span>
          <span class="toggle-switch">
            <input type="checkbox" class="toggle-input" id="toggle-all" checked>
            <span class="toggle-slider"></span>
          </span>
        </label>
      </div>
      <div class="popup-divider"></div>
      <div id="plugin-list" class="popup-toggles"></div>
    </section>

    <footer class="popup-footer">
      <button id="reset-btn" class="popup-reset">Reset to defaults</button>
    </footer>
  </div>

  <script src="./main.ts" type="module"></script>
</body>
</html>
